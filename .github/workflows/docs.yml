name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer (referenced by the Deja project) derives the version from git tags.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish docs site
        run: dotnet publish docs/Deja.Docs/Deja.Docs.csproj -c Release -o publish

      # Prerenders one index.html per route (crawler-visible head tags), writes sitemap.xml,
      # rewrites <base href> for the repo subpath and emits a noindex 404.html SPA fallback.
      - name: Generate SEO files
        run: dotnet run --project docs/Deja.Docs.Seo -c Release -- publish/wwwroot https://lisihasaj.github.io/Deja/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
