    <script>
        // Applied before the first paint so a stored theme choice never flashes the other theme.
        (function () {
            var theme = localStorage.getItem('deja-theme');
            if (theme === 'dark' || theme === 'light') {
                document.documentElement.setAttribute('data-theme', theme);
            }
            if (localStorage.getItem('deja-docs-lang') === 'de') {
                document.documentElement.lang = 'de';
            }
        })();
    </script>
